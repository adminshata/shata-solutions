version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: shata-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: shata
      POSTGRES_PASSWORD: shata_dev_password
      POSTGRES_DB: shata_restaurant_os
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shata"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shata-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Uncomment for local email testing
  # mailhog:
  #   image: mailhog/mailhog
  #   container_name: shata-mailhog
  #   ports:
  #     - "1025:1025"
  #     - "8025:8025"

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: shata-network
