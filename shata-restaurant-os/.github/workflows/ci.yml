name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shata
          POSTGRES_PASSWORD: shata
          POSTGRES_DB: shata_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://shata:shata@localhost:5432/shata_test
      REDIS_URL: redis://localhost:6379
      CLERK_SECRET_KEY: test_placeholder
      CLERK_JWKS_URL: https://placeholder.clerk.accounts.dev/.well-known/jwks.json
      JWT_SECRET: test_secret_32_chars_minimum_here
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_WS_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: shata-restaurant-os

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: shata-restaurant-os/packages/database

      - name: Run DB migrations
        run: npx prisma migrate deploy
        working-directory: shata-restaurant-os/packages/database

      - name: Type-check all packages
        run: npx turbo type-check
        working-directory: shata-restaurant-os

      - name: Lint
        run: npx turbo lint
        working-directory: shata-restaurant-os

      - name: Test
        run: npx turbo test
        working-directory: shata-restaurant-os

      - name: Build
        run: npx turbo build
        working-directory: shata-restaurant-os
