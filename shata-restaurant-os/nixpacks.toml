# Nixpacks config for Railway monorepo deployment
# Root directory MUST be set to: shata-restaurant-os (not packages/api)

[phases.install]
# --include=dev: Railway sets NODE_ENV=production for builds, which makes npm
# default to omitting devDependencies. @nestjs/cli (the `nest` build CLI) is a
# devDependency of @shata/api, so without this flag `nest build` fails with
# "nest: not found".
cmds = ["npm install --include=dev"]

[phases.build]
cmds = [
  "npx turbo build --filter=@shata/api..."
]

[start]
cmd = "node packages/api/dist/main.js"
